name: Continuous Deployment (VPS Orange)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest 

    steps:
      # Step 1: Checkout kode di runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Terhubung ke VPS via SSH dan jalankan perintah deployment
      - name: Deploy to VPS Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}   
          port: 22                         

          script: |
            FNM_PATH="/home/ubuntu/.local/share/fnm"
            if [ -d "$FNM_PATH" ]; then
              export PATH="$FNM_PATH:$PATH"
              eval "`fnm env`"
            fi
            fnm use 22
            cd ~/app
            git pull origin main
            npm install
            npm run migrate up
            pm2 restart forumapi